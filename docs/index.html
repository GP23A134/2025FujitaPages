<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス階層</title>
  <link rel="stylesheet" href="style.css">
  <script src="data/web/class-data.js" defer></script>
  <script src="data/web/instance-data.js" defer></script>
    <script src="tree.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body data-mode="browse" class="browse-show-ids">
  <div id="loading-indicator" class="loading-indicator" role="status" aria-live="polite">データを読み込み中…</div>
  <header class="page-header">
    <p class="eyebrow">KNOWLEDGE GRAPH VIEWER</p>
    <h1>クラス階層</h1>
    <p class="page-description">上位・中間クラスごとにクラスを検索、参照できます。</p>
    <div class="page-header-actions">
      <a class="page-link-button" href="edit.html">編集画面へ</a>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="表示切替">
      <button type="button" class="tab is-active" id="tree-tab" role="tab" aria-selected="true"
        aria-controls="tree-panel">
        階層ツリー
      </button>
      <button type="button" class="tab" id="target-class-tab" role="tab" aria-selected="false"
        aria-controls="target-class-panel">
        クラス一覧
      </button>
      <button type="button" class="tab" id="middle-class-tab" role="tab" aria-selected="false"
        aria-controls="middle-class-panel">
        中間クラス一覧
      </button>
      <button type="button" class="tab" id="top-class-tab" role="tab" aria-selected="false"
        aria-controls="top-class-panel">
        上位クラス一覧
      </button>
    </div>

    <section id="tree-panel" class="tab-panel" role="tabpanel" aria-labelledby="tree-tab">
      <div class="tree-toolbar" role="toolbar" aria-label="ツリー操作">
        <button type="button" class="tree-toolbar-button" data-close-all-tree>すべて閉じる</button>
        <button type="button" id="toggle-browse-ids" class="tree-toolbar-button" aria-pressed="true">クラスID表示: ON</button>
      </div>
      <details class="tree-filter" role="search" aria-label="階層ツリーの絞り込み" open>
        <summary class="tree-filter-heading"><span>検索</span><span id="tree-filter-count" class="tree-filter-count" aria-live="polite"></span></summary>
        <div class="tree-filter-body">
        <div class="tree-filter-mode-switch" role="group" aria-label="絞り込み方式">
          <button type="button" class="is-active" data-tree-filter-method="keyword" aria-pressed="true">キーワード検索</button>
          <button type="button" data-tree-filter-method="count" aria-pressed="false">件数</button>
        </div>
        <div class="tree-filter-search-controls">
          <label for="tree-filter-type">検索対象
            <select id="tree-filter-type">
              <option value="class">クラス</option>
              <option value="instance">インスタンス</option>
            </select>
          </label>
          <label class="tree-filter-query-label" for="tree-filter-query">検索語
            <input id="tree-filter-query" type="search" aria-label="検索語" placeholder="名前・IDで検索" autocomplete="off">
          </label>
        </div>
        <fieldset class="tree-filter-count-settings" hidden>
          <label class="tree-filter-count-mode-label" for="tree-filter-count-mode">インスタンス件数
            <select id="tree-filter-count-mode" aria-label="件数指定方法">
              <option value="range">範囲指定</option>
              <option value="exact" selected>指定件数</option>
            </select>
          </label>
          <fieldset id="tree-filter-count-range" class="tree-filter-count-range" hidden>
            <label class="tree-filter-range-bound" for="tree-filter-count-min">最小
              <input id="tree-filter-count-min" type="number" min="0" step="1" inputmode="numeric" aria-label="最小件数" value="0"><span>件</span>
            </label>
            <span class="tree-filter-range-separator" aria-hidden="true">～</span>
            <label class="tree-filter-range-bound" for="tree-filter-count-max">最大
              <input id="tree-filter-count-max" type="number" min="0" step="1" inputmode="numeric" aria-label="最大件数"><span>件</span>
            </label>
          </fieldset>
          <label id="tree-filter-count-exact" class="tree-filter-count-exact"><span class="tree-filter-count-exact-title">指定件数：<output id="tree-filter-count-exact-value">0件</output></span>
            <span class="tree-filter-exact-slider-row"><span id="tree-filter-count-exact-min">0件</span><input id="tree-filter-count-exact-input" class="tree-filter-exact-slider" type="range" min="0" max="0" step="1" value="0" aria-label="指定件数"><span id="tree-filter-count-exact-max">0件</span></span>
          </label>
        </fieldset>
        </div>
      </details>
      <div id="tree" class="tree" role="tree"></div>
    </section>

    <section id="top-class-panel" class="tab-panel" role="tabpanel" aria-labelledby="top-class-tab" hidden>
      <h2>上位クラス一覧</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ラベル</th>
          </tr>
        </thead>
        <tbody id="top-class-rows"></tbody>
      </table>
    </section>

    <section id="middle-class-panel" class="tab-panel" role="tabpanel" aria-labelledby="middle-class-tab" hidden>
      <h2>中間クラス一覧</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ラベル</th>
          </tr>
        </thead>
        <tbody id="middle-class-rows"></tbody>
      </table>
    </section>

    <section id="target-class-panel" class="tab-panel" role="tabpanel" aria-labelledby="target-class-tab" hidden>
      <h2>クラス一覧</h2>
      <div class="class-search" role="search">
        <label for="top-class-filter">
          上位クラス
          <select id="top-class-filter">
            <option value="">すべて</option>
          </select>
        </label>
        <label for="middle-class-filter">
          中間クラス
          <select id="middle-class-filter">
            <option value="">すべて</option>
          </select>
        </label>
        <label for="class-text-filter" class="class-search-text">
          検索
          <input id="class-text-filter" type="search" placeholder="ID・ラベルで部分一致検索">
        </label>
        <button type="button" id="download-class-tsv" class="search-button">
          絞り込み結果をTSV保存
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ラベル</th>
          </tr>
        </thead>
        <tbody id="target-class-rows"></tbody>
      </table>
    </section>
  </main>
  <dialog id="target-instance-dialog" class="target-instance-dialog" aria-labelledby="target-instance-title">
    <form method="dialog" class="target-instance-dialog-header"><h2 id="target-instance-title"></h2><button type="submit" class="target-instance-dialog-close" aria-label="閉じる">×</button></form>
    <p id="target-instance-count" class="target-instance-count"></p><ul id="target-instance-list" class="target-instance-list"></ul>
  </dialog>
</body>
</html>
